# cargo-nextest: `just test` runs it, and CI with `--profile ci`.

[profile.default]
# A test that runs this long is reported as slow, and one that runs four times
# as long is stopped: the tests that start real processes can hang.
slow-timeout = { period = "15s", terminate-after = 4 }

# Building the Rust scaffold compiles kotodama-extension once more, with the
# features the scaffold asks for, which on a cold CI runner takes longer than
# any other test.
[[profile.default.overrides]]
filter = "test(the_rust_scaffold_builds_and_passes_the_check)"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
# Report every failure in one run rather than stop at the first.
fail-fast = false
