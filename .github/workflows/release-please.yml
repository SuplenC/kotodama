name: Release

# release-please reads the Conventional Commits that reach main and keeps one
# release PR open with the next version and its changelog. Merging that PR
# tags the release and publishes it on GitHub. Its config is
# release-please-config.json; .release-please-manifest.json holds the last
# released version.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A PR opened with GITHUB_TOKEN doesn't start CI. With a RELEASE_PLEASE_TOKEN
      # secret (a fine-grained token with contents and pull-requests write) it does.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
