name: Release

# release-please reads the Conventional Commits that reach main and keeps one
# release PR open with the next version and its changelog. Merging that PR
# tags the release and publishes it on GitHub. Its config is
# release-please-config.json; .release-please-manifest.json holds the last
# released version.
#
# It runs only when started by hand for now: the repo doesn't let workflows open
# PRs, so a run on every push to main would fail. Put `push: branches: [main]`
# back once that's allowed or a RELEASE_PLEASE_TOKEN secret exists.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A PR opened with GITHUB_TOKEN doesn't start CI. With a RELEASE_PLEASE_TOKEN
      # secret (a fine-grained token with contents and pull-requests write) it does.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
