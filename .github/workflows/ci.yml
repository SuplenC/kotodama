name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # check and test, and e2e, run as separate jobs so they overlap. Each restores
  # a cargo cache (the registry and target/) keyed on the lockfiles; only runs
  # on main save it, so PRs start from main's build without filling the
  # repository's cache quota.
  test:
    name: check, test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The lockfiles pin every dependency and, through the flake, the toolchain,
      # so an exact hit rebuilds only the workspace's own crates. A miss falls
      # back to the newest cache of the same job.
      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ matrix.runner }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-test-${{ matrix.runner }}-
      - run: nix develop --command just check
      - run: nix develop --command just test
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  e2e:
    name: e2e (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The lockfiles pin every dependency and, through the flake, the toolchain,
      # so an exact hit rebuilds only the workspace's own crates. A miss falls
      # back to the newest cache of the same job.
      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-e2e-${{ matrix.runner }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-e2e-${{ matrix.runner }}-
      # The latency test needs a release build of the workspace, which no cache
      # can skip (the PR changes the crates), so it runs only on main.
      - run: nix develop --command just e2e
        env:
          E2E_SKIP: ${{ github.event_name == 'pull_request' && 'latency' || '' }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.runner }}
          path: e2e/out
          if-no-files-found: ignore

  # Runs the base commit's benchmarks and this commit's on the same runner, one after
  # the other, and compares them. Shared runners differ too much from one another for
  # a baseline saved by another run to mean anything. Only the relative change is
  # checked: 50% for timings, 10% for the Daemon's resident memory.
  bench:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check out the base commit
        id: base
        run: |
          # Both checkouts build into one target directory, so dependencies build once.
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "::warning::No base commit to compare with; benchmarks were not compared."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          echo "dir=$RUNNER_TEMP/base" >> "$GITHUB_OUTPUT"
      # Restored after the base checkout, so both builds start from main's
      # dependencies; bench-run touches each checkout's sources, so the
      # workspace's own crates always rebuild.
      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/target
          key: cargo-bench-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-bench-
      - name: Run the base commit's benchmarks
        if: steps.base.outputs.dir
        run: scripts/bench-run "${{ steps.base.outputs.dir }}" bench-base.txt
      - name: Run this commit's benchmarks
        run: scripts/bench-run . bench-current.txt
      - name: Compare
        if: steps.base.outputs.dir
        run: |
          scripts/bench-compare bench-base.txt bench-current.txt 50
          scripts/bench-compare bench-base.txt bench-current.txt 10 bytes
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Builds the package, loads its QML module in Quickshell, and runs it in a
  # NixOS VM: socket activation and the home-manager module now, the live
  # Hyprland tests (#13) later, since Hyprland needs a DRM device.
  # Only on main for now: the Nix build compiles the whole package from source
  # on every PR (about 8 minutes), with no cargo cache.
  nixos-vm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build -L .#checks.x86_64-linux.nixos-vm .#checks.x86_64-linux.qml-module

  # The image only copies files onto nixos/nix, so both platforms build without emulation.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: image
        run: echo "name=$(scripts/dev-image)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/suplenc/kotodama-dev:latest
            ${{ steps.image.outputs.name }}
