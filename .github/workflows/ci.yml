name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # On pull requests, decides which jobs the change needs. It lists the paths
  # that can be ignored, so a path nobody listed runs everything. Pushes to main
  # skip this and run every job. `bench` (and `instructions`) also ignores the
  # crates no benchmark builds on (scripts/bench-crates lists the ones that
  # matter) and the files only the other jobs, the dev image or releases read.
  # `latency`, the e2e test, runs for the crates the Daemon, the `kotodama`
  # command and the QML module build on, and the e2e harness; `nix`, the Nix
  # package and its VM tests, for what the package or the flake read.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      e2e: ${{ steps.diff.outputs.e2e }}
      bench: ${{ steps.diff.outputs.bench }}
      latency: ${{ steps.diff.outputs.latency }}
      nix: ${{ steps.diff.outputs.nix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          benched=" $(scripts/bench-crates | tr '\n' ' ')"
          echo "crates the benchmarks build on:$benched"
          measured=" $(scripts/path-deps kotodamad kotodama kotodama-qml | tr '\n' ' ')"
          echo "crates the latency test builds on:$measured"
          rust=false e2e=false bench=false latency=false nix=false
          while read -r path; do
            case $path in
              # The protocol reference is written by a test, which fails when it is stale.
              docs/protocol.md) rust=true ;;
              *.md | docs/* | LICENSE) ;;
              e2e/latency/* | e2e/run | e2e/lib.sh | e2e/sway.conf) e2e=true latency=true ;;
              e2e/*) e2e=true ;;
              # Tests in the crates run the example Extensions.
              examples/*) rust=true e2e=true ;;
              crates/*)
                rust=true e2e=true nix=true
                crate=${path#crates/}
                case $benched in *" ${crate%%/*} "*) bench=true ;; esac
                case $measured in *" ${crate%%/*} "*) latency=true ;; esac
                ;;
              scripts/qml-module) rust=true e2e=true latency=true ;;
              # Read only by `just check`, which `test` runs.
              .config/rustfmt.toml | clippy.toml | scripts/comments | scripts/fmt | scripts/self-imports | scripts/restyled-crates) rust=true ;;
              nix/home-manager.nix | nix/home-manager-extensions.nix | nix/tests/*) rust=true e2e=true nix=true ;;
              docker/* | .config/nextest.toml | scripts/dev-image | scripts/tests/* | \
                .github/workflows/release-please.yml | release-please-config.json | \
                .release-please-manifest.json | .gitignore)
                rust=true e2e=true
                ;;
              *) rust=true e2e=true bench=true latency=true nix=true ;;
            esac
          done < <(git diff --name-only "$BASE"...HEAD)
          echo "rust=$rust e2e=$e2e bench=$bench latency=$latency nix=$nix"
          printf 'rust=%s\ne2e=%s\nbench=%s\nlatency=%s\nnix=%s\n' \
            "$rust" "$e2e" "$bench" "$latency" "$nix" >> "$GITHUB_OUTPUT"

  # check and test, and e2e, run as separate jobs so they overlap. Each restores
  # a cargo cache (the registry and target/) keyed on the lockfiles; only runs
  # on main save it, so PRs start from main's build without filling the
  # repository's cache quota.
  linear:
    # A branch is rebased onto main, never merged with it: main gets one
    # merge commit per pull request and none from inside a branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          merges=$(git log --merges --oneline "$BASE..$HEAD")
          if [ -n "$merges" ]; then
            echo "::error::The branch has merge commits. Rebase it onto main instead (git rebase origin/main):"
            echo "$merges"
            exit 1
          fi

  test:
    name: check, test (${{ matrix.runner }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The lockfiles pin every dependency and, through the flake, the toolchain,
      # so an exact hit rebuilds only the workspace's own crates. A miss falls
      # back to the newest cache of the same job.
      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ matrix.runner }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-test-${{ matrix.runner }}-
      - run: nix develop --command just check
      - run: nix develop --command just test
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  e2e:
    name: e2e (${{ matrix.runner }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.e2e == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The lockfiles pin every dependency and, through the flake, the toolchain,
      # so an exact hit rebuilds only the workspace's own crates. The release
      # profile in Cargo.toml decides how the dependencies build, so it keys the
      # cache too. A miss falls back to the newest cache of the same job.
      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-e2e-${{ matrix.runner }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-e2e-${{ matrix.runner }}-
      # The latency test builds the workspace in release. Main's cache holds the
      # dependencies' release build, so only the workspace's crates rebuild.
      # On a PR it runs when `changes` found something it builds on.
      - run: nix develop --command just e2e
        env:
          E2E_SKIP: ${{ github.event_name == 'pull_request' && needs.changes.outputs.latency != 'true' && 'latency' || '' }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.runner }}
          path: e2e/out
          if-no-files-found: ignore

  # Compares this commit's benchmarks with the base commit's, and fails when a
  # timing is more than 50% higher, or the Daemon's resident memory 10%.
  #
  # On main, both commits run on the same runner, one after the other, with
  # criterion's default times, and this commit's results are saved in the cache
  # as bench-results-<sha>.
  #
  # On a PR, saved results stand in for running the base commit: the base
  # commit's own, or else main's latest (the base's are often not saved yet,
  # since main's run for it is still going), so only this commit builds and
  # runs, with shorter criterion times. Shared runners differ in speed by up to
  # 2x, so a timing over the limit against saved results is confirmed by running
  # the base commit here and comparing again. Resident memory doesn't depend on
  # the runner. Without any saved results, both commits run here, as on main.
  #
  # `ci` doesn't wait for this job: criterion timings on shared runners are too
  # noisy to hold a merge for, and building two commits takes about 25 minutes.
  # A PR still shows it, main runs it in full, and `instructions`, the
  # deterministic gate, stays required.
  bench:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.bench == 'true') }}
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      # Criterion's defaults are a 3 s warm-up and 5 s of measurement per benchmark.
      CRITERION_ARGS: ${{ github.event_name == 'pull_request' && '--warm-up-time 1 --measurement-time 2 --noplot' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Restore the base commit's saved results
        id: saved
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: bench-saved.txt
          key: bench-results-${{ github.event.pull_request.base.sha }}
          restore-keys: bench-results-
      - name: Check out the base commit
        id: base
        env:
          SAVED: ${{ steps.saved.outputs.cache-matched-key != '' }}
          MATCHED: ${{ steps.saved.outputs.cache-matched-key }}
        run: |
          # Both checkouts build into one target directory, so dependencies build once.
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "::warning::No base commit to compare with; benchmarks were not compared."
            exit 0
          fi
          if [ "$SAVED" = true ]; then
            echo "bench: comparing with the saved $MATCHED (base commit $BASE); only this commit runs."
            echo "bench: they were measured on:$(sed -n 's/^# cpu://p' bench-saved.txt)"
            cp bench-saved.txt bench-base.txt
          else
            echo "bench: no saved results; both commits run on this runner."
          fi
          # Checked out either way: a timing over the limit against saved results reruns it here.
          git fetch --no-tags --depth=1 origin "$BASE"
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          echo "dir=$RUNNER_TEMP/base" >> "$GITHUB_OUTPUT"
      # Restored after the base checkout, so both builds start from main's
      # dependencies; bench-run touches each checkout's sources, so the
      # workspace's own crates always rebuild. Keyed on Cargo.toml as well as
      # the lockfiles: its release profile, which benchmarks build with,
      # decides how the dependencies build.
      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/target
          key: cargo-bench-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-bench-
      - name: Run the base commit's benchmarks
        if: steps.base.outputs.dir && steps.saved.outputs.cache-matched-key == ''
        run: scripts/bench-run "${{ steps.base.outputs.dir }}" bench-base.txt
      - name: Run this commit's benchmarks
        id: current
        run: |
          echo "bench: this runner:$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2-)"
          scripts/bench-run . bench-current.txt
      - name: Compare
        id: compare
        if: steps.base.outputs.dir
        env:
          SAVED: ${{ steps.saved.outputs.cache-matched-key != '' }}
        run: |
          scripts/bench-compare bench-base.txt bench-current.txt 10 bytes
          if scripts/bench-compare bench-base.txt bench-current.txt 50; then
            exit 0
          fi
          if [ "$SAVED" != true ]; then
            exit 1
          fi
          echo "bench: a timing is over the limit against another runner's results; running the base commit here to confirm."
          echo "confirm=true" >> "$GITHUB_OUTPUT"
      - name: Confirm against the base commit on this runner
        if: steps.compare.outputs.confirm
        run: |
          scripts/bench-run "${{ steps.base.outputs.dir }}" bench-base-here.txt
          scripts/bench-compare bench-base-here.txt bench-current.txt 50
      # Saved even when the comparison failed: they are still this commit's
      # results, which the PRs based on it compare against.
      - name: Save this commit's results
        id: results
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.current.outcome == 'success' }}
        run: |
          if [ -s bench-current.txt ]; then
            { echo "# cpu:$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2-)"; cat bench-current.txt; } >bench-saved.txt
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ !cancelled() && steps.results.outputs.save }}
        uses: actions/cache/save@v6
        with:
          path: bench-saved.txt
          key: bench-results-${{ github.sha }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Builds the package, loads its QML module in Quickshell, and runs it in a
  # NixOS VM (socket activation and the home-manager module), and runs the
  # Hyprland Extension live in another, since Hyprland needs a DRM device. The
  # package's dependencies are a derivation of their own (nix/package.nix),
  # which main pushes to Cachix, so a PR builds only the workspace's crates.
  nixos-vm:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.nix == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build -L .#checks.x86_64-linux.nixos-vm .#checks.x86_64-linux.hyprland-vm .#checks.x86_64-linux.qml-module .#checks.x86_64-linux.home-manager-extensions .#checks.x86_64-linux.home-manager-ai .#checks.x86_64-linux.home-manager-options

  # Builds each package Kotodama is released as on its own, one `nix build`
  # each: the core, the Front end and every Bundled extension. Each builds
  # only its own crates, on the dependencies they share (nix/package.nix).
  packages:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.nix == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: |
          packages=$(nix eval --raw .#packages.x86_64-linux --apply '
            packages: toString (builtins.filter
              (name: builtins.match "kotodama-.*" name != null && name != "kotodama-full" && name != "kotodama-extensions")
              (builtins.attrNames packages))')
          echo "packages: $packages"
          for package in $packages; do
            echo "::group::$package"
            nix build -L --no-link ".#$package"
            echo "::endgroup::"
          done

  # Counts the instructions the Daemon runs per keystroke
  # (scripts/bench-instructions), for the base commit and this one, and fails
  # when a benchmark runs 5% more. Callgrind's counts are the same from run to
  # run on one runner, so unlike `bench`'s timings, small changes show.
  instructions:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.bench == 'true') }}
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check out the base commit
        id: base
        run: |
          # Both checkouts build into one target directory, so dependencies
          # build once, and keep their counts in one place.
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
          echo "GUNGRAUN_HOME=$RUNNER_TEMP/gungraun" >> "$GITHUB_ENV"
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "::warning::No base commit to compare with; instruction counts were not compared."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          echo "dir=$RUNNER_TEMP/base" >> "$GITHUB_OUTPUT"
      # `bench`'s cache: the same profile and dependencies. Only `bench` saves it.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/target
          key: cargo-bench-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-bench-
      - name: Count the base commit's instructions
        if: steps.base.outputs.dir
        run: scripts/bench-instructions "${{ steps.base.outputs.dir }}" save
      - name: Count this commit's instructions
        run: scripts/bench-instructions . compare

  # The image only copies files onto nixos/nix, so both platforms build without emulation.
  image:
    # `test` and `e2e` need the PR-only `changes` job, which is skipped on
    # pushes; without `!cancelled()` that skip would skip this job too.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.e2e.result == 'success' }}
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: image
        run: echo "name=$(scripts/dev-image)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/suplenc/kotodama-dev:latest
            ${{ steps.image.outputs.name }}

  # The one required check: fails if a job it needs failed or was cancelled, and
  # passes when each succeeded or was skipped as not needed.
  ci:
    needs: [changes, linear, test, e2e, instructions, nixos-vm, packages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case $result in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
