[package]
name = "kotodama-extension"
version.workspace = true
description = "What every Rust Extension of Kotodama needs: the protocol over stdio, lean memory, config readers, sending only changed Items, starting programs and watching directories"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The directory watcher, which brings in `notify`. Off unless asked for.
watch = ["dep:notify"]
# The shared test harness. For dev-dependencies only.
testing = []
# Finding the compositor, and the clipboard's data-control protocols, for the
# Daemon and the clipboard Extension. Brings in the Wayland crates, on Linux
# only. Off unless asked for.
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr"]

[dependencies]
kotodama-protocol = { path = "../kotodama-protocol" }
log = "0.4.34"
notify = { version = "8", optional = true }
thiserror = "2.0.21"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
wayland-client = { version = "0.31.15", optional = true }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"], optional = true }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
