[package]
name = "kotodama-extension"
# Its major.minor is the protocol version it speaks, as kotodama-protocol's is:
# see README.md.
version = "1.0.0"
description = "What every Rust Extension of Kotodama needs: the protocol over stdio, lean memory, config readers, sending only changed Items, starting programs and watching directories"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["kotodama", "launcher", "wayland", "extension", "plugin"]
categories = ["gui", "api-bindings"]

[features]
# The directory watcher, which brings in `notify`. Off unless asked for.
watch = ["dep:notify"]
# The shared test harness. For dev-dependencies only.
testing = []
# Finding the compositor, and the clipboard's data-control protocols, for the
# Daemon and the clipboard Extension. Brings in the Wayland crates, on Linux
# only. Off unless asked for.
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr"]

[dependencies]
# The protocol version this crate speaks, raised with it.
kotodama-protocol = { path = "../kotodama-protocol", version = "1.0" }
log = "0.4.34"
# 9 for `Config::with_event_kinds`, which keeps reads out of the kernel's watch: a
# watched directory others read from (`$HOME`, `/usr/share`, the Nix store) would
# wake the watcher's thread on every read otherwise.
# Pinned exactly, as a later release candidate may still change the API.
notify = { version = "=9.0.0-rc.6", optional = true }
thiserror = "2.0.21"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
wayland-client = { version = "0.31.15", optional = true }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"], optional = true }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"

# docs.rs documents the optional modules too.
[package.metadata.docs.rs]
features = ["watch", "wayland"]

[lints]
workspace = true
