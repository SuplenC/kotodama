# The calculator Bundled extension. A package installs this directory as
# `$XDG_DATA_DIRS/kotodama/extensions/calculator/`, with the
# `kotodama-calculator` binary next to this file (or `command` rewritten to its
# absolute path).
name = "calculator"
description = "Arithmetic, units, currency, dates and time zones, answered as you type"
command = ["./kotodama-calculator"]
# Its app answers every query, math-looking or not; the search only those
# the triggers below pick.
word = "calc"
title = "Calculator"
icon = "accessories-calculator"
about = "Arithmetic, units, currency, dates and time zones. Enter copies the answer."
examples = [
    { query = "15min in sec", result = "900 secs" },
    { query = "$100 to eur", result = "€ at today's rate" },
    { query = "days until christmas", result = "The days left" },
    { query = "now in Tokyo", result = "The time there" },
]

# Every keystroke that looks like math is sent at once: an answer must land in
# the same frame as the keystroke, and only a debounce of 0 may mark one.
[live_query]
prefixes = ["="]
triggers = [
    # A number first, perhaps after a sign, a bracket or a currency symbol:
    # `2+2`, `-3*4`, `(1+2)`, `$100 to eur`, `5pm PT in Warsaw`.
    '^\s*[-+(.√$€£¥]*\s*[0-9]',
    # A function of a number: `sqrt 2`, `log(100)`.
    '(?i)^\s*(sqrt|cbrt|sin|cos|tan|asin|acos|atan|ln|log|exp|abs|round)\s*\(?\s*[0-9]',
    # Date arithmetic: `today + 3 weeks`, `dec 25 - 1 month`.
    '(?i)^\s*(today|tomorrow|yesterday)\s*[-+]',
    '(?i)^\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+[0-9]{1,2}(st|nd|rd|th)?,?(\s+[0-9]{4})?\s*[-+]',
    # A named date, perhaps after `next` or `last`, and then an amount:
    # `christmas - 1 week`, `next friday + 2 days`, `my birthday + 1 month`.
    '(?i)^\s*[a-z\x27’]+(\s+[a-z\x27’]+){0,3}\s+[-+]\s*(an?\s|[0-9])',
    # The time elsewhere: `now in Tokyo`, `time in Tokyo`, `what time is it
    # in Tokyo`, `what's the time in Tokyo`, `Tokyo time`.
    '(?i)^\s*now\s+(in|to)\s',
    '(?i)^\s*((what|current)\b.*\s)?time\s+(is\s+it\s+)?in\s',
    '(?i)\stime\s*[?!]?\s*$',
    # Counting days, however it is asked: `days til xmas`, `how many days
    # until christmas?`, `how long since easter`.
    '(?i)^\s*(days|how\s+many\s+days|how\s+long)\s',
    # A date relative to today: `in 3 weeks`, `in a week`, `a week ago`,
    # `10 days from now`.
    '(?i)^\s*in\s+(an?|[0-9]+)\s',
    '(?i)\s(ago|from\s+(now|today))\s*[?!]?\s*$',
]
debounce_ms = 0
