[package]
name = "kotodama-calculator"
version.workspace = true
description = "The calculator Bundled extension: arithmetic, units, currency, dates and time zones as Live query answers"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Arithmetic, units and currency conversion; no dependencies of its own.
fend-core = "1.5.8"
# Dates and time zones, which fend can't do. The time zone database is the
# system's (`/usr/share/zoneinfo`, or `$TZDIR`), never bundled.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
kotodama-extension = { path = "../kotodama-extension" }
kotodama-protocol = { path = "../kotodama-protocol" }
serde_json = "1.0.154"

[dev-dependencies]
# The answer benchmark runs the real Daemon in process.
kotodamad = { path = "../kotodamad" }
tempfile = "3.27.0"

[[bench]]
name = "answer"
harness = false
