# The clipboard history Bundled extension. A package installs this directory
# as `$XDG_DATA_DIRS/kotodama/extensions/clipboard/`, with the
# `kotodama-clipboard` binary next to this file (or `command` rewritten to its
# absolute path).
name = "clipboard"
description = "Everything copied, kept for a week, to paste again; never what a password manager copies"
command = ["./kotodama-clipboard"]
# What was copied stays out of the search, in its app, which lists the
# History first.
word = "clipboard"
title = "Clipboard"
icon = "edit-paste"
about = "Everything copied this week. Type to find a clip; Enter pastes it into the window you came from."
examples = [
    { query = "https", result = "The links copied" },
]
commands = ["history", "pause"]
in_search = false
