[package]
name = "kotodama-clipboard"
version = "0.1.0"
description = "The clipboard history Bundled extension: what was copied, kept on disk, as Indexed items"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
kotodama-extension = { path = "../kotodama-extension", features = ["wayland"] }
kotodama-protocol = { path = "../kotodama-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["event", "pipe"] }
wayland-client = "0.31.15"

[dev-dependencies]
kotodama-extension = { path = "../kotodama-extension", features = ["testing", "wayland"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
kotodamad = { path = "../kotodamad" }
tempfile = "3.27.0"

[[bench]]
name = "search"
harness = false

[lints]
workspace = true
