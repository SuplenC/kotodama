# The Hyprland Bundled extension. A package installs this directory as
# `$XDG_DATA_DIRS/kotodama/extensions/hyprland/`, with the `kotodama-hyprland`
# binary next to this file (or `command` rewritten to its absolute path).
name = "hyprland"
description = "Hyprland's open windows, to focus, close, move or float, and its keyboard shortcuts, searchable and listed by modifier"
command = ["./kotodama-hyprland"]
# The windows are in the search; the keyboard shortcuts in its app alone.
word = "hyprland"
title = "Hyprland"
icon = "preferences-system-windows"
about = "The open windows, to focus, close, move or float, and every keyboard shortcut, to look up or run."
examples = [
    { query = "firefox", result = "Focus its window" },
    { query = "screenshot", result = "The bind that takes one" },
]
commands = ["shortcuts"]
