[package]
name = "kotodama-hyprland"
version = "0.1.0"
description = "The Hyprland Bundled extension: open windows to focus, close, move or float, and the keyboard shortcuts, read from Hyprland's sockets"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kotodama-extension = { path = "../kotodama-extension" }
kotodama-protocol = { path = "../kotodama-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

# The keymap Hyprland hands Wayland clients, which names the keys of the binds
# made on a keycode. The same pure-Rust Wayland client the clipboard and system
# Extensions use; no xkb library: the keymap's text is read by hand.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["event"] }
wayland-client = "0.31.15"

[dev-dependencies]
kotodama-extension = { path = "../kotodama-extension", features = ["testing"] }
tempfile = "3.27.0"

[lints]
workspace = true
