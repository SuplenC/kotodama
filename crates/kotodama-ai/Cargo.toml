[package]
name = "kotodama-ai"
version = "0.1.0"
description = "The AI Bundled extension: proposes Actions from the Action catalog for what the user asks, each confirmed before it runs"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kotodama-extension = { path = "../kotodama-extension" }
kotodama-protocol = { path = "../kotodama-protocol" }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
kotodama-extension = { path = "../kotodama-extension", features = ["testing"] }
tempfile = "3.27.0"
