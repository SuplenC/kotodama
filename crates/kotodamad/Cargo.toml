[package]
name = "kotodamad"
version.workspace = true
description = "The Kotodama Daemon: the index, the ranking and the Extension host"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kotodama-protocol = { path = "../kotodama-protocol" }
log = "0.4.34"
notify = "8"
nucleo-matcher = "0.3.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rustix = { version = "1.1.5", features = ["event", "fs", "pipe"] }
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27.0"

[[bench]]
name = "query"
harness = false

[[bench]]
name = "daemon"
harness = false
