[package]
name = "kotodamad"
version.workspace = true
description = "The Kotodama Daemon: the index, the ranking and the Extension host"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kotodama-extension = { path = "../kotodama-extension", features = ["watch", "wayland"] }
kotodama-protocol = { path = "../kotodama-protocol" }
log = "0.4.34"
nucleo-matcher = "0.3.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["event", "fs", "pipe"] }
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }

[dev-dependencies]
# The ranking scenarios answer math with the real calculator, and fall back
# on the real web search.
kotodama-calculator = { path = "../kotodama-calculator" }
kotodama-web-search = { path = "../kotodama-web-search" }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Exactly the version of the gungraun-runner in the dev shell (nix/gungraun-runner.nix).
gungraun = "=0.20.0"
tempfile = "3.27.0"

[[bench]]
name = "query"
harness = false

[[bench]]
name = "daemon"
harness = false

# gungraun, not criterion: scripts/bench-run leaves out every bench target of
# this name, and CI's `instructions` job runs them.
[[bench]]
name = "instructions"
harness = false
