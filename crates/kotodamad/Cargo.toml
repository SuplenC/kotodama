[package]
name = "kotodamad"
version = "0.1.0"
description = "The Kotodama Daemon: the index, the ranking and the Extension host"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kotodama-protocol = { path = "../kotodama-protocol" }
log = "0.4.34"
notify = "8"
nucleo-matcher = "0.3.1"
regex = "1.13.1"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["event", "fs", "pipe"] }
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
