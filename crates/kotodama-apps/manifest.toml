# The apps Bundled extension. A package installs this directory as
# `$XDG_DATA_DIRS/kotodama/extensions/apps/`, with the `kotodama-apps` binary
# next to this file (or `command` rewritten to its absolute path).
name = "apps"
description = "Desktop applications, from the .desktop files in the XDG data directories"
command = ["./kotodama-apps"]
# Its app, which Tab on the "Applications" Item enters; every app is in the
# search too.
prefix = "apps"
title = "Applications"
icon = "applications-other"
about = "Every installed application. Type part of a name, a description or a category; Enter launches it."
examples = [
    { query = "fire", result = "Firefox" },
    { query = "text editor", result = "The apps described as one" },
]
