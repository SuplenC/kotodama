[package]
name = "kotodama-folders"
version.workspace = true
description = "The Folder source Bundled extension: projects and scripts from the folders the user names, as Indexed items"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kotodama-protocol = { path = "../kotodama-protocol" }
notify = "8"
shlex = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
kotodamad = { path = "../kotodamad" }
tempfile = "3.27.0"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
