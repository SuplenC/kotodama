[package]
name = "kotodama-folders"
version.workspace = true
description = "The Folder source Bundled extension: projects and scripts from the folders the user names, as Indexed items"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kotodama-extension = { path = "../kotodama-extension", features = ["watch"] }
kotodama-protocol = { path = "../kotodama-protocol" }
shlex = "2"

[dev-dependencies]
kotodama-extension = { path = "../kotodama-extension", features = ["testing"] }
kotodamad = { path = "../kotodamad" }
tempfile = "3.27.0"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true
