# The emoji Bundled extension. A package installs this directory as
# `$XDG_DATA_DIRS/kotodama/extensions/emoji/`, with the `kotodama-emoji` binary
# next to this file (or `command` rewritten to its absolute path).
name = "emoji"
description = "Emoji, with their skin tones, and symbols such as arrows, math and ⌘ ⌥ ⇧, typed or copied"
command = ["./kotodama-emoji"]
# The emoji stay out of the search, in its app: the search shows one "Emoji"
# Item, and Tab or Enter on it enters the app.
word = "emoji"
title = "Emoji"
icon = "face-smile"
about = "Emoji and symbols, by name or keyword. Enter types it into the window you came from; Ctrl+K types it in another skin tone."
examples = [
    { query = "fire", result = "🔥 Fire" },
    { query = "arrow", result = "→ Rightwards Arrow" },
    { query = "cmd", result = "⌘ Place of Interest Sign" },
]
in_search = false
