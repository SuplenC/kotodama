[package]
name = "kotodama-protocol"
version.workspace = true
description = "The messages, framing and Manifest schema that the Kotodama Daemon, Front ends and Extensions share, and how they launch programs"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
itoa = "1.0.18"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
# bilrost, müsli and prost are measured against the Wire formats in
# benches/formats.rs, and prost checks the protobuf Wire format is standard
# protobuf (tests/protobuf.rs). None of them is in the protocol itself.
bilrost = "0.1016.2"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
musli = { version = "0.1.9", features = ["wire"] }
prost = "0.14.4"

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "formats"
harness = false
