[package]
name = "kotodama-protocol"
version.workspace = true
description = "The messages, framing and Manifest schema that the Kotodama Daemon, Front ends and Extensions share, and how they launch programs"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
itoa = "1.0.18"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "batch"
harness = false
