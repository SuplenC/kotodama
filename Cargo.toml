[workspace]
resolver = "3"
members = ["crates/kotodama", "crates/kotodama-ai", "crates/kotodama-apps", "crates/kotodama-calculator", "crates/kotodama-clipboard", "crates/kotodama-emoji", "crates/kotodama-extension", "crates/kotodama-folders", "crates/kotodama-hyprland", "crates/kotodama-protocol", "crates/kotodama-qml", "crates/kotodama-system", "crates/kotodama-web-search", "crates/kotodamad"]

# No shared version: each crate is a package of its own, which release-please
# versions and releases on its own (release-please-config.json).
[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SuplenC/kotodama"

# The lints of docs/agents/code-quality.md. A crate opts in with
# `[lints] workspace = true` once it is restyled (#108); scripts/restyled-crates
# reads that line to check its formatting and comments as well. `just check`
# runs clippy with -D warnings, so every warning here fails it.
[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Opt-outs from pedantic, each with its reason:
# - The guide asks #[must_use] of constructors and builders, which
#   `return_self_not_must_use` covers, not of every function with a result.
must_use_candidate = "allow"
# - Numeric casts are deliberate across the workspace: the Index keeps u32
#   positions and f32 scores to save memory, Qt takes i32 rows, and the hot
#   loops convert without a checked conversion's branch. An #[expect] on each
#   of the ~150 casts would be noise.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# The guide's rules clippy checks, beyond pedantic (`manual_let_else` and
# `return_self_not_must_use` are pedantic, named so they stay on). Tests and
# benches may unwrap: `just check` lints them with `unwrap_used` off.
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
manual_let_else = "warn"
mod_module_files = "warn"
return_self_not_must_use = "warn"
unwrap_used = "warn"

# What ships: the Nix package (crane builds with --release), the e2e latency
# test, and every benchmark, as `bench` inherits it. Measured in #137 against
# Cargo's defaults (16 codegen units, no LTO): 8% fewer instructions over the
# keystroke benchmarks, kotodamad 22% smaller and 4% less resident. One codegen
# unit also keeps an edit off the keystroke path from moving the instruction
# counts: one that moved them 0.7% with the defaults moves them 0.03%. A
# workspace rebuild takes about 2.5 times as long. `cargo test` uses the dev
# profile, which this leaves alone. panic stays `unwind`: a panicking thread
# then kills only itself, not the Daemon, nor the Quickshell that loads the QML
# module.
[profile.release]
lto = "fat"
codegen-units = 1

# Tests and dev builds keep line tables, enough for a panic's backtrace to name
# the file and line, and the dependencies keep none: full debuginfo was most of
# what target/ held and what the linker read. Nothing here runs a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
